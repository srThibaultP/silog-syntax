name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VSCE_VERSION: "4.1.0"

jobs:
  build:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JSON files
        run: |
          for f in package.json language-configuration.json syntaxes/silog.tmLanguage.json snippets/silog.code-snippets; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"
          done

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Le tag ${GITHUB_REF_NAME} ne correspond pas à la version du package ($PKG)"; exit 1
          fi

      - name: Package extension
        run: npx --yes @vscode/vsce@${VSCE_VERSION} package --out silog-syntax.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: silog-syntax-vsix
          path: silog-syntax.vsix
          if-no-files-found: error

  publish:
    name: Publish (tag v*)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: silog-syntax-vsix

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "Secret VSCE_PAT manquant"; exit 1; fi
          npx --yes @vscode/vsce@${VSCE_VERSION} publish --packagePath silog-syntax.vsix

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" silog-syntax.vsix \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
